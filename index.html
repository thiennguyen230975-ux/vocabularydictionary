        // Web Audio Synthesizer for UI SFX

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.12); // E5
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);

                    osc.frequency.setValueAtTime(220, ctx.currentTime);

            };

            const lower = cleanWord.toLowerCase();

                return {
                    word: cleanWord,
                    ipa: dict[lower].ipa,
                    pos: dict[lower].pos,
                    meaning: dict[lower].meaning,
                    example: dict[lower].example,
                    example_translation: dict[lower].example_tr,
                    memory_tip: 'Từ vựng quan trọng bổ sung tự động vào hệ thống.'
                };

        const FlashcardsView = ({ words, decks, selectedDeckId, setSelectedDeckId, setWords, addXP }) => {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isFlipped, setIsFlipped] = React.useState(false);

            // Filter cards by selected deck
            const activeWords = React.useMemo(() => {
                if (selectedDeckId === 'all') return words;
                return words.filter(w => w.deckId === selectedDeckId);
            }, [words, selectedDeckId]);

            const currentWord = activeWords[currentIndex];

            // Keyboard shortcut for card flip and SRS actions
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        setIsFlipped(prev => !prev);
                        playSFX('flip');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            // SRS Rating Handler (SuperMemo-2 based)
            const handleSRSRating = (quality) => {
                if (!currentWord) return;
                playSFX(quality >= 3 ? 'correct' : 'wrong');

                let { easeFactor, interval, repetition, status } = currentWord;
                // Quality: 1 (Again), 2 (Hard), 3 (Good), 4 (Easy)
                if (quality === 1) { // Again
                    repetition = 0;
                    interval = 0;
                    status = 'learning';
                } else if (quality === 2) { // Hard
                    repetition += 1;
                    interval = 1;
                    status = 'review';
                } else if (quality === 3) { // Good
                    repetition += 1;
                    interval = interval === 0 ? 1 : interval === 1 ? 3 : Math.round(interval * easeFactor);
                    status = 'review';
                } else if (quality === 4) { // Easy
                    repetition += 1;
                    interval = interval === 0 ? 3 : Math.round(interval * easeFactor * 1.3);
                    status = 'mastered';
                }

                // Update next review date
                const nextDate = new Date();
                nextDate.setDate(nextDate.getDate() + interval);

                setWords(prev => prev.map(w => w.id === currentWord.id ? {
                    ...w,
                    easeFactor,
                    interval,
                    repetition,
                    status,
                    nextReviewDate: nextDate.toISOString()
                } : w));

                addXP(quality * 5);

                // Move to next card
                setIsFlipped(false);
                if (currentIndex < activeWords.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                } else {
                    setCurrentIndex(0);
                }
            };

            const toggleFavorite = (e) => {
                e.stopPropagation();
                if (!currentWord) return;
                setWords(prev => prev.map(w => w.id === currentWord.id ? { ...w, favorite: !w.favorite } : w));
            };

            if (!currentWord) {
                return (
                    <div className="text-center py-16 space-y-4">

        const QuizPracticeView = ({ words, decks, selectedDeckId, setSelectedDeckId, addXP }) => {
            const [mode, setMode] = React.useState('choice'); // choice | fill | dictation
            const [quizIndex, setQuizIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [combo, setCombo] = React.useState(0);
            const [userAnswer, setUserAnswer] = React.useState('');
            const [selectedOption, setSelectedOption] = React.useState(null);
            const [isSubmitted, setIsSubmitted] = React.useState(false);

            const activeWords = React.useMemo(() => {
                const list = selectedDeckId === 'all' ? words : words.filter(w => w.deckId === selectedDeckId);
                return [...list].sort(() => 0.5 - Math.random());
            }, [words, selectedDeckId]);

            const current = activeWords[quizIndex];

            // Generate 4 Multiple Choice Options
            const choiceOptions = React.useMemo(() => {
                if (!current) return [];
                const correct = current.meaning;
                const others = words.filter(w => w.meaning !== correct).map(w => w.meaning);
                const shuffledOthers = [...others].sort(() => 0.5 - Math.random()).slice(0, 3);
                return [...shuffledOthers, correct].sort(() => 0.5 - Math.random());
            }, [current, words]);

            const handleAnswerSubmit = (selectedChoice) => {
                if (isSubmitted || !current) return;
                setIsSubmitted(true);

                let isCorrect = false;
                if (mode === 'choice') {
                    setSelectedOption(selectedChoice);
                    isCorrect = (selectedChoice === current.meaning);
                } else {
                    isCorrect = (userAnswer.trim().toLowerCase() === current.word.toLowerCase());
                }

                if (isCorrect) {
                    playSFX('correct');
                    const bonus = combo * 2;
                    setScore(prev => prev + 10 + bonus);
                    setCombo(prev => prev + 1);
                    addXP(15);
                } else {
                    playSFX('wrong');
                    setCombo(0);
                }

                setTimeout(() => {
                    setIsSubmitted(false);
                    setSelectedOption(null);
                    setUserAnswer('');
                    if (quizIndex < activeWords.length - 1) {
                        setQuizIndex(prev => prev + 1);
                    } else {
                        // Complete Session Confetti
                        if (window.confetti) {
                            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        }
                    }
                }, 1400);
            };

            if (!current) {
                return (
                    <div className="text-center py-16">
                        <h3 className="text-xl font-bold text-slate-900 dark:text-white">Hãy chọn bộ từ vựng để bắt đầu luyện tập!</h3>
                    </div>
                );

            return (
                <div className="max-w-2xl mx-auto space-y-6 animate-fadeIn">

                    <div className="flex items-center justify-between gap-2 bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">

                            { id: 'fill', label: 'Điền câu' },
                            { id: 'dictation', label: 'Nghe & Gõ' }
                        ].map(m => (
                            <button
                                key={m.id}
                                onClick={() => { setMode(m.id); setQuizIndex(0); setCombo(0); setScore(0); }}
                                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                                    mode === m.id
                                        ? 'bg-indigo-600 text-white shadow-sm'
                                        : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
                                }`}
                            >
                                {m.label}
                            </button>
                        ))}
                    </div>

                    {/* Quiz Scoreboard Banner */}
                    <div className="flex items-center justify-between bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl">
                        <div className="text-xs font-bold text-slate-500">
                            Câu <span className="text-indigo-500">{quizIndex + 1}</span> / {activeWords.length}
                        </div>
                        <div className="flex items-center gap-4 text-xs font-bold">
                            <span className="text-amber-500">🔥 Combo: x{combo}</span>
                            <span className="text-emerald-500">⭐ Điểm: {score}</span>
                        </div>
                    </div>

                    {/* Quiz Body Card */}
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 text-center shadow-xl">

                        {/* MODE 1: TRẮC NGHIỆM */}
                        {mode === 'choice' && (
                            <div className="space-y-6">
                                <span className="inline-block px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-xs font-bold">
                                    Chọn nghĩa tiếng Việt đúng
                                </span>
                                <h3 className="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white">{current.word}</h3>
                                <p className="text-sm font-mono text-slate-400">{current.ipa}</p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left pt-2">
                                    {choiceOptions.map((option, idx) => {
                                        let btnStyle = 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200';
                                        if (isSubmitted) {
                                            if (option === current.meaning) {
                                                btnStyle = 'bg-emerald-600 text-white border-emerald-500';
                                            } else if (option === selectedOption) {
                                                btnStyle = 'bg-red-600 text-white border-red-500';
                                            }
                                        }

                                        return (
                                            <button
                                                key={idx}
                                                disabled={isSubmitted}
                                                onClick={() => handleAnswerSubmit(option)}
                                                className={`p-4 rounded-2xl border text-sm font-bold transition-all flex items-center justify-between ${btnStyle}`}
                                            >
                                                <span>{option}</span>
                                                <span className="text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700">{String.fromCharCode(65 + idx)}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* MODE 2: ĐIỀN TỪ VÀO CÂU VÍ DỤ */}
                        {mode === 'fill' && (
                            <div className="space-y-6">
                                <span className="inline-block px-3 py-1 rounded-full bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-bold">
                                    Điền từ tiếng Anh thích hợp vào ô trống
                                </span>
                                <div className="text-lg font-bold text-slate-800 dark:text-slate-200 italic bg-slate-50 dark:bg-slate-800 p-5 rounded-2xl">
                                    "{current.example ? current.example.replace(new RegExp(current.word, 'gi'), '_______') : '_______'}"
                                </div>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Nghĩa tiếng Việt: {current.meaning}</p>

                                <form onSubmit={(e) => { e.preventDefault(); handleAnswerSubmit(); }} className="space-y-4 max-w-md mx-auto">
                                    <input
                                        type="text"
                                        value={userAnswer}
                                        onChange={(e) => setUserAnswer(e.target.value)}
                                        placeholder="Nhập từ tiếng Anh chính xác..."
                                        className="w-full bg-slate-50 dark:bg-slate-950 border-2 border-slate-300 dark:border-slate-700 rounded-2xl px-5 py-3 text-center text-lg font-bold text-slate-900 dark:text-white outline-none focus:border-indigo-500"
                                    />
                                    <button
                                        type="submit"
                                        className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-sm font-bold transition shadow-lg shadow-indigo-600/20"
                                    >
                                        Kiểm tra đáp án
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* MODE 3: NGHE VÀ GÕ TỪ (DICTATION) */}
                        {mode === 'dictation' && (
                            <div className="space-y-6">
                                <span className="inline-block px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-bold">
                                    Luyện nghe phát âm & gõ chính tả
                                </span>

                                <div className="py-4">
                                    <button
                                        onClick={() => speakWord(current.word)}
                                        className="p-5 rounded-full bg-indigo-600 text-white hover:scale-110 shadow-lg shadow-indigo-600/30 transition mx-auto"
                                    >
                                        <Icon name="volume" className="w-8 h-8" />
                                    </button>
                                    <p className="text-xs text-slate-400 mt-2">Nhấn để nghe lại phát âm</p>
                                </div>

                                <p className="text-xs text-slate-500">Gợi ý nghĩa: {current.meaning}</p>

                                <form onSubmit={(e) => { e.preventDefault(); handleAnswerSubmit(); }} className="space-y-4 max-w-md mx-auto">
                                    <input
                                        type="text"
                                        value={userAnswer}
                                        onChange={(e) => setUserAnswer(e.target.value)}
                                        placeholder="Gõ từ bạn nghe được..."
                                        className="w-full bg-slate-50 dark:bg-slate-950 border-2 border-slate-300 dark:border-slate-700 rounded-2xl px-5 py-3 text-center text-lg font-bold text-slate-900 dark:text-white outline-none focus:border-indigo-500"
                                    />
                                    <button
                                        type="submit"
                                        className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl text-sm font-bold transition shadow-lg shadow-emerald-600/20"
                                    >
                                        Xác nhận
                                    </button>
                                </form>
                            </div>
                        )}

                    </div>
                </div>
            );
        };


        const DecksView = ({ decks, setDecks, words, setWords, onStartStudy, onOpenAddDeckModal, onOpenAddWordModal }) => {

                downloadAnchor.setAttribute("href", dataStr);

        const DictionaryView = ({ words, setWords, decks, onEditWord }) => {

                                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 outline-none"
                            >
                                <option value="all">Tất cả từ</option>
                                <option value="favorite">⭐ Yêu thích</option>
                                <option value="mastered">✅ Đã thuộc</option>
                            </select>
                        </div>
                    </div>

                    {/* Table View */}
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800/50 text-slate-400 text-[11px] font-bold uppercase tracking-wider border-b border-slate-200 dark:border-slate-800">
                                        <th className="p-4">Từ tiếng Anh</th>
                                        <th className="p-4">Nghĩa tiếng Việt</th>
                                        <th className="p-4">Bộ từ</th>
                                        <th className="p-4 text-center">Trạng thái</th>
                                        <th className="p-4 text-right">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">
                                    {filteredWords.map(w => {
                                        const deck = decks.find(d => d.id === w.deckId);

                                        return (
                                            <tr key={w.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                                                <td className="p-4 font-bold text-slate-900 dark:text-white">
                                                    <div className="flex items-center gap-2">
                                                        <span>{w.word}</span>
                                                        <button onClick={() => speakWord(w.word)} className="p-1 rounded text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-500/20">
                                                            <Icon name="volume" className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                    <div className="text-[10px] text-slate-400 font-mono">{w.ipa}</div>
                                                </td>
                                                <td className="p-4 text-slate-700 dark:text-slate-300">{w.meaning}</td>
                                                <td className="p-4 text-slate-500">{deck ? deck.title : 'General'}</td>
                                                <td className="p-4 text-center">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                                        w.status === 'mastered'
                                                            ? 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'
                                                            : 'bg-slate-100 dark:bg-slate-800 text-slate-500'
                                                    }`}>
                                                        {w.status === 'mastered' ? 'Đã thuộc' : 'Đang học'}
                                                    </span>
                                                </td>
                                                <td className="p-4 text-right">
                                                    <div className="flex items-center justify-end gap-2">
                                                        <button onClick={() => onEditWord(w)} className="p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                                                            <Icon name="edit" className="w-4 h-4" />
                                                        </button>
                                                        <button onClick={() => deleteWord(w.id)} className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                                                            <Icon name="trash" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };


        const ImportFileView = ({ decks, setDecks, words, setWords, onImportComplete }) => {
            const [parsedPreview, setParsedPreview] = React.useState([]);
            const [targetDeckId, setTargetDeckId] = React.useState(decks[0]?.id || '');
            const [newDeckTitle, setNewDeckTitle] = React.useState('');
            const [searchTerm, setSearchTerm] = React.useState('');
            const [isParsing, setIsParsing] = React.useState(false);

            // Handle Drag & Drop File Parser
            const processFile = (file) => {
                setIsParsing(true);
                const fileName = file.name.toLowerCase();

                if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        parseRawRows(jsonData);
                    };
                    reader.readAsArrayBuffer(file);
                } else if (fileName.endsWith('.csv') || fileName.endsWith('.txt')) {
                    Papa.parse(file, {
                        complete: (results) => {
                            parseRawRows(results.data);
                        }
                    });
                }
            };

            const parseRawRows = (rows) => {
                let items = [];
                // Check if structured headers exist
                if (rows.length > 0 && rows[0].length > 1) {
                    const headers = rows[0].map(h => String(h).toLowerCase().trim());
                    const wordIdx = headers.findIndex(h => h.includes('word') || h.includes('term') || h.includes('từ'));
                    const meaningIdx = headers.findIndex(h => h.includes('meaning') || h.includes('definition') || h.includes('nghĩa'));
                    const ipaIdx = headers.findIndex(h => h.includes('ipa') || h.includes('phonetic') || h.includes('phiên âm'));
                    const exampleIdx = headers.findIndex(h => h.includes('example') || h.includes('ví dụ'));

                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        const wordStr = row[wordIdx >= 0 ? wordIdx : 0];
                        if (!wordStr) continue;

                        const enriched = enrichRawWord(String(wordStr));
                        if (enriched) {
                            if (meaningIdx >= 0 && row[meaningIdx]) enriched.meaning = String(row[meaningIdx]);
                            if (ipaIdx >= 0 && row[ipaIdx]) enriched.ipa = String(row[ipaIdx]);
                            if (exampleIdx >= 0 && row[exampleIdx]) enriched.example = String(row[exampleIdx]);
                            items.push({ ...enriched, selected: true, id: `imp-${Date.now()}-${i}` });
                        }
                    }
                } else {
                    // Raw single column list of English words (one per line)
                    rows.forEach((row, i) => {
                        if (row && row[0]) {
                            const enriched = enrichRawWord(String(row[0]));
                            if (enriched) {
                                items.push({ ...enriched, selected: true, id: `imp-${Date.now()}-${i}` });
                            }
                        }
                    });
                }

                setParsedPreview(items);
                setIsParsing(false);
            };

            const handleConfirmImport = () => {
                let activeDeck = targetDeckId;

                // Create new deck if chosen
                if (targetDeckId === 'new') {
                    if (!newDeckTitle.trim()) {
                        alert('Vui lòng nhập tên bộ từ mới!');
                        return;
                    }
                    const newDeck = {
                        id: `deck-${Date.now()}`,
                        title: newDeckTitle.trim(),
                        description: 'Bộ từ vựng được import từ file',
                        category: 'Imported',
                        color: 'from-purple-600 to-indigo-600'
                    };
                    setDecks(prev => [...prev, newDeck]);
                    activeDeck = newDeck.id;
                }

                const selectedItems = parsedPreview.filter(item => item.selected).map(item => ({
                    id: `w-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                    deckId: activeDeck,
                    word: item.word,
                    ipa: item.ipa,
                    pos: item.pos,
                    meaning: item.meaning,
                    example: item.example,
                    example_translation: item.example_translation,
                    memory_tip: item.memory_tip,
                    status: 'new',
                    easeFactor: 2.5,
                    interval: 0,
                    repetition: 0,
                    nextReviewDate: new Date().toISOString(),
                    favorite: false
                }));

                setWords(prev => [...prev, ...selectedItems]);
                if (window.confetti) window.confetti();
                onImportComplete(activeDeck);
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6 animate-fadeIn">
                    <div>
                        <h2 className="text-2xl font-black text-slate-900 dark:text-white">Import File Từ Vựng Thông Minh</h2>
                        <p className="text-xs text-slate-500">Hỗ trợ file CSV, XLSX, hoặc danh sách từ thô (tự động điền phiên âm IPA, từ loại và ví dụ)</p>
                    </div>

                    {/* Drag and Drop Zone */}
                    <div
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); }}
                        className="border-2 border-dashed border-slate-300 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 rounded-3xl p-8 text-center bg-white dark:bg-slate-900 transition cursor-pointer space-y-4"
                    >
                        <div className="w-16 h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-500 flex items-center justify-center mx-auto">
                            <Icon name="import" className="w-8 h-8" />
                        </div>

                        <div className="space-y-1">
                            <h4 className="font-bold text-base text-slate-800 dark:text-white">Kéo thả file vào đây hoặc nhấn để chọn file</h4>
                            <p className="text-xs text-slate-400">Định dạng hỗ trợ: .CSV, .XLSX, .TXT (Tối đa 500 từ)</p>
                        </div>

                        <input
                            type="file"
                            accept=".csv, .xlsx, .xls, .txt"
                            onChange={(e) => { if (e.target.files[0]) processFile(e.target.files[0]); }}
                            className="hidden"
                            id="file-input-field"
                        />
                        <label htmlFor="file-input-field" className="inline-block px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-bold transition cursor-pointer">
                            Chọn File từ máy tính
                        </label>
                    </div>

                    {/* Preview Section */}
                    {parsedPreview.length > 0 && (
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 space-y-5 shadow-xl">
                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800 pb-4">
                                <h3 className="font-bold text-lg text-slate-900 dark:text-white">Xem trước danh sách ({parsedPreview.filter(i => i.selected).length} từ)</h3>

                                <div className="flex items-center gap-3 w-full sm:w-auto">
                                    <select
                                        value={targetDeckId}
                                        onChange={(e) => setTargetDeckId(e.target.value)}
                                        className="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white outline-none"
                                    >
                                        {decks.map(d => <option key={d.id} value={d.id}>Thêm vào: {d.title}</option>)}
                                        <option value="new">+ Tạo bộ từ mới...</option>
                                    </select>

                                    {targetDeckId === 'new' && (
                                        <input
                                            type="text"
                                            value={newDeckTitle}
                                            onChange={(e) => setNewDeckTitle(e.target.value)}
                                            placeholder="Tên bộ từ mới..."
                                            className="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white outline-none"
                                        />
                                    )}
                                </div>
                            </div>

                            {/* Preview Table */}
                            <div className="max-h-80 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 pr-1">
                                {parsedPreview.map((item, idx) => (
                                    <div key={item.id} className="py-3 flex items-center justify-between gap-4 text-xs">
                                        <div className="flex items-center gap-3">
                                            <input
                                                type="checkbox"
                                                checked={item.selected}
                                                onChange={() => {
                                                    setParsedPreview(prev => prev.map((it, i) => i === idx ? { ...it, selected: !it.selected } : it));
                                                }}
                                                className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500"
                                            />
                                            <div>
                                                <div className="font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                                    <span>{item.word}</span>
                                                    <span className="font-mono text-slate-400 text-[10px]">{item.ipa}</span>
                                                    <span className="px-2 py-0.5 rounded bg-indigo-50 dark:bg-indigo-500/10 text-indigo-500 font-semibold">{item.pos}</span>
                                                </div>
                                                <div className="text-slate-500 mt-0.5">{item.meaning}</div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <button
                                onClick={handleConfirmImport}
                                className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl text-sm font-bold transition shadow-lg shadow-emerald-600/20"
                            >
                                Xác nhận nạp {parsedPreview.filter(i => i.selected).length} từ vựng
                            </button>
                        </div>
                    )}
                </div>
            );
        };


        const ModalContainer = ({ modalState, closeModal, decks, setDecks, words, setWords }) => {
            const { type, payload } = modalState;

            // Form state for add/edit word
            const [wordText, setWordText] = React.useState(payload?.word || '');
            const [ipaText, setIpaText] = React.useState(payload?.ipa || '');
            const [posText, setPosText] = React.useState(payload?.pos || 'noun');
            const [meaningText, setMeaningText] = React.useState(payload?.meaning || '');
            const [exampleText, setExampleText] = React.useState(payload?.example || '');
            const [deckId, setDeckId] = React.useState(payload?.deckId || decks[0]?.id || '');

            // Form state for new deck
            const [deckTitle, setDeckTitle] = React.useState('');
            const [deckDesc, setDeckDesc] = React.useState('');

            const handleSaveWord = (e) => {
                e.preventDefault();
                if (type === 'editWord') {
                    setWords(prev => prev.map(w => w.id === payload.id ? {
                        ...w,
                        word: wordText,
                        ipa: ipaText,
                        pos: posText,
                        meaning: meaningText,
                        example: exampleText,
                        deckId
                    } : w));
                } else {
                    const newWord = {
                        id: `w-${Date.now()}`,
                        deckId,
                        word: wordText,
                        ipa: ipaText,
                        pos: posText,
                        meaning: meaningText,
                        example: exampleText,
                        status: 'new',
                        easeFactor: 2.5,
                        interval: 0,
                        repetition: 0,
                        nextReviewDate: new Date().toISOString(),
                        favorite: false
                    };
                    setWords(prev => [...prev, newWord]);
                }
                closeModal();
            };

            const handleSaveDeck = (e) => {
                e.preventDefault();
                const newDeck = {
                    id: `deck-${Date.now()}`,
                    title: deckTitle,
                    description: deckDesc || 'Bộ từ vựng tùy chỉnh',
                    category: 'Custom',
                    color: 'from-purple-600 to-indigo-600'
                };
                setDecks(prev => [...prev, newDeck]);
                closeModal();
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-lg p-6 space-y-5 shadow-2xl animate-fadeIn">

                        {(type === 'addWord' || type === 'editWord') && (
                            <form onSubmit={handleSaveWord} className="space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                                    {type === 'editWord' ? 'Chỉnh sửa từ vựng' : 'Thêm từ vựng mới'}
                                </h3>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Từ tiếng Anh (*)</label>
                                        <input
                                            required
                                            type="text"
                                            value={wordText}
                                            onChange={(e) => setWordText(e.target.value)}
                                            placeholder="vd: Resilient"
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Phiên âm IPA</label>
                                        <input
                                            type="text"
                                            value={ipaText}
                                            onChange={(e) => setIpaText(e.target.value)}
                                            placeholder="vd: /rɪˈzɪl.i.ənt/"
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Từ loại</label>
                                        <select
                                            value={posText}
                                            onChange={(e) => setPosText(e.target.value)}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none"
                                        >
                                            <option value="noun">Danh từ (noun)</option>
                                            <option value="verb">Động từ (verb)</option>
                                            <option value="adjective">Tính từ (adjective)</option>
                                            <option value="adverb">Trạng từ (adverb)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Bộ từ vựng</label>
                                        <select
                                            value={deckId}
                                            onChange={(e) => setDeckId(e.target.value)}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none"
                                        >
                                            {decks.map(d => <option key={d.id} value={d.id}>{d.title}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">Nghĩa tiếng Việt (*)</label>
                                    <input
                                        required
                                        type="text"
                                        value={meaningText}
                                        onChange={(e) => setMeaningText(e.target.value)}
                                        placeholder="vd: Kiên cường, phục hồi nhanh"
                                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-indigo-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">Ví dụ câu minh họa</label>
                                    <textarea
                                        rows="2"
                                        value={exampleText}
                                        onChange={(e) => setExampleText(e.target.value)}
                                        placeholder="vd: She is a resilient leader..."
                                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-indigo-500 resize-none"
                                    />
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={closeModal} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold">Hủy</button>
                                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md">Lưu từ vựng</button>
                                </div>
                            </form>
                        )}

                        {type === 'addDeck' && (
                            <form onSubmit={handleSaveDeck} className="space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white">Tạo bộ từ vựng mới</h3>

                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">Tên bộ từ (*)</label>
                                    <input
                                        required
                                        type="text"
                                        value={deckTitle}
                                        onChange={(e) => setDeckTitle(e.target.value)}
                                        placeholder="vd: Từ vựng Chuyên ngành Marketing"
                                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">Mô tả ngắn</label>
                                    <input
                                        type="text"
                                        value={deckDesc}
                                        onChange={(e) => setDeckDesc(e.target.value)}
                                        placeholder="vd: Các thuật ngữ phổ biến trong chạy quảng cáo..."
                                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white outline-none"
                                    />
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={closeModal} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold">Hủy</button>
                                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md">Tạo Bộ Từ</button>
                                </div>
                            </form>
                        )}

                    </div>
                </div>
            );
        };


        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

    </script>
</body>
</html>
